<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern US Flag</title>
  <style>
    body {
      background: linear-gradient(135deg, #f0f2f5, #d9e2ec);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .flag {
      width: 450px;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff, #f9f9f9);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .stripe {
      flex: 1;
      width: 100%;
    }

    .red {
      background: linear-gradient(135deg, #ff5f5f, #ff3c3c);
    }

    .white {
      background: linear-gradient(135deg, #ffffff, #f2f2f2);
    }

    .union {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: calc(7 * 100% / 13);
      background: linear-gradient(135deg, #334488, #2c3970);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
      padding: 6px;
      border-bottom-right-radius: 12px;
    }

    .star {
      color: white;
      font-size: 14px;
      text-align: center;
      align-self: center;
      justify-self: center;
      text-shadow: 0 0 3px rgba(255,255,255,0.6);
      user-select: none;
    }

  </style>
</head>
<body>

<div class="flag" id="flag">
  <!-- Stripes will be generated by JS -->
  <div class="union" id="union">
    <!-- Stars will be generated by JS -->
  </div>
</div>

<script>
  const flag = document.getElementById('flag');
  const union = document.getElementById('union');

  // Generate stripes
  for (let i = 0; i < 13; i++) {
    const stripe = document.createElement('div');
    stripe.className = 'stripe ' + (i % 2 === 0 ? 'red' : 'white');
    flag.appendChild(stripe);
  }

  // Bring union to front
  flag.appendChild(union);

  // Generate stars
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 6; col++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.innerHTML = '★';
      // Offset every other row
      if (row % 2 !== 0 && col === 5) continue; // skip last star in odd rows
      union.appendChild(star);
    }
  }
</script>

</body>
</html>
