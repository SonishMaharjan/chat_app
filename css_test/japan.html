<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japan Flag - Aesthetic Version</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .flag {
      width: 320px;
      height: 200px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      border: 2px solid #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 30% 30%, #ff4e50, #c91432);
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(201, 20, 50, 0.3);
    }

    .flag-title {
      position: absolute;
      bottom: 15px;
      font-size: 1rem;
      color: #555;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    .flag {
  width: 320px;
  height: 200px;
  background: linear-gradient(white, #f9f9f9);
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  position: relative;
  overflow: hidden;
  border: 2px solid #e0e0e0;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: float 5s ease-in-out infinite;
}

.circle {
  width: 90px;
  height: 90px;
  background: radial-gradient(circle at 30% 30%, #ff4e50, #c91432);
  border-radius: 50%;
  box-shadow: 0 5px 15px rgba(201, 20, 50, 0.5);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

  </style>
</head>
<body>

<div class="flag">
  <div class="circle"></div>
  <div class="flag-title">Japan 🇯🇵</div>
</div>

</body>
</html>
