<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glossy Indian Flag</title>
  <style>
    body {
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .flag {
      width: 360px;
      height: 240px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
      position: relative;
      background: white;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .saffron, .white, .green {
      flex: 1;
      width: 100%;
    }

    .saffron {
      background: linear-gradient(135deg, #FF9933, #ffb366);
    }

    .white {
      background: linear-gradient(135deg, #ffffff, #f2f2f2);
      position: relative;
    }

    .green {
      background: linear-gradient(135deg, #138808, #1ca31c);
    }

    .ashoka-chakra {
      width: 70px;
      height: 70px;
      border: 3px solid #000080;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      z-index: 2;
    }

    /* Simple central spoke */
    .ashoka-chakra::before {
      content: "";
      position: absolute;
      width: 2px;
      height: 100%;
      background: #000080;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Glossy overlay */
    .glossy {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5) 0%, 
                                            rgba(255, 255, 255, 0.1) 50%, 
                                            rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      z-index: 1;
    }

  </style>
</head>
<body>

  <div class="flag">
    <div class="saffron"></div>
    <div class="white">
      <div class="ashoka-chakra"></div>
    </div>
    <div class="green"></div>
    <div class="glossy"></div> <!-- Glossy layer -->
  </div>

</body>
</html>
